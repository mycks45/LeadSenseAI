<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globetrotter Leads | Medical Abroad Agencies Scraper</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        /* Search Form */
        .search-area {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        input[type="text"], select {
            flex: 1;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            appearance: none;
        }
        
        select option {
            background-color: var(--bg-color);
            color: #fff;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
        
        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.btn {
            padding: 1rem 2rem;
            border-radius: 12px;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
        }

        button.btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        button.btn:active {
            transform: translateY(0);
        }

        button.btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Loader */
        .loader-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 2rem;
            padding: 2rem;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            color: var(--accent-primary);
            font-weight: 600;
            font-size: 1.2rem;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .loader-subtext {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Error Messages */
        .error-msg {
            display: none;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        /* Results Area */
        .results-area {
            display: none;
            margin-top: 2rem;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .download-btn {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
        }

        .download-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            box-shadow: none;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        th {
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        a.table-link {
            color: var(--accent-primary);
            text-decoration: none;
            transition: color 0.2s;
        }
        
        a.table-link:hover {
            color: var(--accent-secondary);
            text-decoration: underline;
        }

        /* Terminal Window */
        .terminal-container {
            margin-top: 1.5rem;
            background: #0b0f19;
            border-radius: 8px;
            border: 1px solid #1e293b;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            display: none;
            width: 100%;
        }
        .terminal-header {
            background: #1e293b;
            padding: 8px 12px;
            display: flex;
            align-items: center;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }
        .terminal-logs {
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            color: #4ade80;
            font-size: 0.9rem;
            line-height: 1.5;
        }

    </style>
</head>
<body>

    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
            <div style="text-align: left;">
                <h1 style="margin-bottom: 0.5rem; font-size: 2.5rem;">LeadSense AI</h1>
                <p class="subtitle">Extract B2B Medical Abroad Agencies instantly.</p>
            </div>
            <a href="/dashboard" class="btn" style="background: rgba(30, 41, 59, 0.7); border: 1px solid var(--accent-primary); box-shadow: none; color: white;">🗄️ Dashboard</a>
        </header>

        <section class="glass-panel">
            <div class="search-area">
                <select id="stateSelect" onchange="populateDistricts()">
                    <option value="" disabled selected>Select a State</option>
                </select>
                <select id="districtSelect" disabled>
                    <option value="" disabled selected>Select a District</option>
                </select>
            </div>
            
            <div class="search-area" style="margin-bottom: 2rem;">
                <input type="text" id="keywordInput" list="keywordRecommendations" placeholder="Change Keyword (Optional)" value="MBBS abroad consultant" onkeydown="if(event.key==='Enter') startScrape()">
                <datalist id="keywordRecommendations">
                    <option value="MBBS abroad consultant">
                    <option value="Medical overseas education">
                    <option value="Study abroad agency">
                    <option value="B2B medical education consultant">
                    <option value="Overseas education consultant">
                </datalist>
                <button class="btn" id="scrapeBtn" onclick="startScrape()">Start Scraping</button>
            </div>
            
            <div id="errorMsg" class="error-msg"></div>

            <div id="loader" class="loader-container">
                <div class="spinner"></div>
                <div class="loader-text">Scraping Engine Running</div>
                <div class="loader-subtext">Check the live terminal below for progress...</div>
            </div>

            <!-- Terminal Logs -->
            <div id="terminalArea" class="terminal-container">
                <div class="terminal-header">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                    <span style="margin-left: 10px; color: #94a3b8; font-size: 0.8rem; font-family: 'Inter', sans-serif;">Live Scraper Log</span>
                </div>
                <div id="terminalLogs" class="terminal-logs">
                    <div>> System Online... Waiting to initialize scraper.</div>
                </div>
            </div>

            <div id="resultsArea" class="results-area">
                <div class="results-header">
                    <h2>Found <span id="resultCount">0</span> Leads</h2>
                    <button class="btn download-btn" id="downloadBtn" onclick="downloadCsv()">Download CSV</button>
                </div>

                <div class="table-container">
                    <table id="resultsTable">
                        <thead>
                            <tr>
                                <th>Agency Name</th>
                                <th>Phone Number</th>
                                <th>Email</th>
                                <th>Socials</th>
                                <th>Website</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Rows go here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <script>
        let currentFilename = "";
        let statesData = [];

        window.onload = async function() {
            try {
                const response = await fetch('/static/states-and-districts.json');
                const data = await response.json();
                statesData = data.states;
                populateStates();
            } catch (error) {
                console.error("Failed to load states data", error);
            }
        };

        function populateStates() {
            const stateSelect = document.getElementById("stateSelect");
            statesData.forEach(stateObj => {
                const option = document.createElement("option");
                option.value = stateObj.state;
                option.text = stateObj.state;
                stateSelect.appendChild(option);
            });
        }

        function populateDistricts() {
            const stateSelect = document.getElementById("stateSelect");
            const districtSelect = document.getElementById("districtSelect");
            const selectedState = stateSelect.value;
            
            districtSelect.innerHTML = '<option value="" disabled selected>Select a District</option>';
            districtSelect.disabled = true;

            const stateObj = statesData.find(s => s.state === selectedState);
            if (stateObj && stateObj.districts) {
                stateObj.districts.forEach(district => {
                    const option = document.createElement("option");
                    option.value = district;
                    option.text = district;
                    districtSelect.appendChild(option);
                });
                districtSelect.disabled = false;
            }
        }

        async function startScrape() {
            const districtSelect = document.getElementById("districtSelect");
            const stateSelect = document.getElementById("stateSelect");
            const keywordInput = document.getElementById("keywordInput");
            
            let location = districtSelect.value;
            if (!location) location = stateSelect.value;
            
            let keyword = keywordInput.value.trim();
            if (!keyword) keyword = "MBBS abroad consultant";
            
            if (!location) {
                alert("Please select a State and District!");
                return;
            }

            // UI State change
            const btn = document.getElementById("scrapeBtn");
            const loader = document.getElementById("loader");
            const terminalArea = document.getElementById("terminalArea");
            const terminalLogs = document.getElementById("terminalLogs");
            const resultsArea = document.getElementById("resultsArea");
            const errorMsg = document.getElementById("errorMsg");

            btn.disabled = true;
            btn.innerText = "Running...";
            errorMsg.style.display = "none";
            resultsArea.style.display = "none";
            loader.style.display = "flex";
            terminalArea.style.display = "block";
            terminalLogs.innerHTML = "<div>> Connecting to secure background agent...</div>";

            // Setup WebSocket
            const clientId = Math.random().toString(36).substring(7);
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/scrape/${clientId}`;
            const ws = new WebSocket(wsUrl);
            
            ws.onmessage = function(event) {
                terminalLogs.innerHTML += `<div>> ${event.data}</div>`;
                terminalLogs.scrollTop = terminalLogs.scrollHeight;
            };

            try {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ location: location, keyword: keyword, client_id: clientId })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                if (data.success) {
                    currentFilename = data.filename;
                    renderTable(data.results, data.count);
                    loader.style.display = "none";
                    resultsArea.style.display = "block";
                }

            } catch (error) {
                console.error(error);
                errorMsg.innerText = error.message || "An error occurred during scraping. Please try again.";
                errorMsg.style.display = "block";
                loader.style.display = "none";
            } finally {
                btn.disabled = false;
                btn.innerText = "Start Scraping";
            }
        }

        function renderTable(results, count) {
            document.getElementById("resultCount").innerText = count;
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = ""; // clear previous

            results.forEach(row => {
                const tr = document.createElement("tr");

                const nameTd = document.createElement("td");
                nameTd.innerText = row.Name || "Unknown";

                const phoneTd = document.createElement("td");
                phoneTd.innerText = row.Phone || "-";

                const emailTd = document.createElement("td");
                if (row.Email) {
                    const a = document.createElement("a");
                    a.href = `mailto:${row.Email}`;
                    a.className = "table-link";
                    a.innerText = row.Email;
                    emailTd.appendChild(a);
                } else {
                    emailTd.innerText = "-";
                }

                const socialsTd = document.createElement("td");
                let socialHtml = "";
                if (row.Instagram && row.Instagram !== "undefined") socialHtml += `<a href="${row.Instagram}" target="_blank" style="margin-right:5px; color:#e1306c;">IG</a>`;
                if (row.Facebook && row.Facebook !== "undefined") socialHtml += `<a href="${row.Facebook}" target="_blank" style="margin-right:5px; color:#1877f2;">FB</a>`;
                if (row.LinkedIn && row.LinkedIn !== "undefined") socialHtml += `<a href="${row.LinkedIn}" target="_blank" style="margin-right:5px; color:#0077b5;">IN</a>`;
                socialsTd.innerHTML = socialHtml || "-";

                const webTd = document.createElement("td");
                if (row.Website) {
                    const a = document.createElement("a");
                    a.href = row.Website;
                    a.target = "_blank";
                    a.className = "table-link";
                    a.innerText = "Visit Site";
                    webTd.appendChild(a);
                } else {
                    webTd.innerText = "-";
                }

                tr.appendChild(nameTd);
                tr.appendChild(phoneTd);
                tr.appendChild(emailTd);
                tr.appendChild(socialsTd);
                tr.appendChild(webTd);

                tbody.appendChild(tr);
            });
        }

        function downloadCsv() {
            if (currentFilename) {
                window.location.href = `/download/${encodeURIComponent(currentFilename)}`;
            }
        }
    </script>
</body>
</html>
