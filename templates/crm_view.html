<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead CRM | LeadSense AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1.5rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-main);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* Glass Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Stepper */
        .stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3rem;
            position: relative;
        }
        
        .stepper::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 5%;
            right: 5%;
            height: 2px;
            background: var(--glass-border);
            z-index: 1;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            width: 16%;
        }

        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-color);
            border: 2px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-bottom: 0.5rem;
            transition: all 0.3s;
        }

        .step.active .step-circle {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }
        
        .step.completed .step-circle {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .step-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.2;
        }

        .step.active .step-title, .step.completed .step-title {
            color: var(--text-main);
            font-weight: 600;
        }

        /* Action Panel */
        .action-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }

        .action-box h2 {
            margin-bottom: 1rem;
            color: var(--accent-primary);
        }
        
        .input-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            justify-content: center;
        }

        input[type="email"], input[type="text"] {
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: var(--bg-color);
            color: white;
            width: 300px;
        }
        
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="/dashboard" class="btn btn-outline" style="padding: 0.6rem 1.2rem;">← Back</a>
            <div style="flex: 1;">
                <h1 id="agencyName">Loading CRM Profile...</h1>
                <p class="subtitle" id="agencyMeta">Gathering data...</p>
            </div>
            <!-- Quick-Jump Search -->
            <div style="position: relative; margin-right: 1rem;">
                <input type="text" id="crmSearch" placeholder="Jump to lead..." oninput="searchLeads(this.value)" style="padding: 0.5rem 0.9rem; border-radius: 10px; width: 200px;" autocomplete="off">
                <div id="crmSearchDropdown" style="display:none; position: absolute; top: 110%; left: 0; right: 0; background: rgba(15,23,42,0.98); border: 1px solid var(--glass-border); border-radius: 10px; z-index: 300; max-height: 250px; overflow-y: auto;"></div>
            </div>
            <div>
                <select id="stageOverride" class="btn btn-outline" style="padding: 0.6rem 1rem; cursor: pointer; color: var(--accent-primary); border-color: var(--accent-primary);" onchange="manuallyOverrideStage()">
                    <option value="0">0: New Lead</option>
                    <option value="1">1: Contacted</option>
                    <option value="2">2: Pitched & Req Email</option>
                    <option value="3">3: MOU Sent</option>
                    <option value="4">4: MOU Signed</option>
                    <option value="5">5: Toolkit Sent</option>
                    <option value="6">6: Onboarded</option>
                </select>
            </div>
        </header>

        <section class="glass-panel">
            <div class="stepper" id="stepper">
                <div class="step" id="step-1">
                    <div class="step-circle">1</div>
                    <div class="step-title">Initial Contact</div>
                </div>
                <div class="step" id="step-2">
                    <div class="step-circle">2</div>
                    <div class="step-title">Pitch & Email Req.</div>
                </div>
                <div class="step" id="step-3">
                    <div class="step-circle">3</div>
                    <div class="step-title">Send MOU</div>
                </div>
                <div class="step" id="step-4">
                    <div class="step-circle">4</div>
                    <div class="step-title">MOU Signed</div>
                </div>
                <div class="step" id="step-5">
                    <div class="step-circle">5</div>
                    <div class="step-title">Send Toolkit</div>
                </div>
                <div class="step" id="step-6">
                    <div class="step-circle">6</div>
                    <div class="step-title">Onboarded</div>
                </div>
            </div>

            <div class="action-box" id="actionPanel">
                <h2>Loading lifecycle actions...</h2>
            </div>

            <div class="remarks-box" id="remarksPanel" style="margin-top: 2.5rem; text-align: left;">
                <h3 style="color: var(--accent-primary); border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem; margin-bottom: 1rem;"><i class="fas fa-history"></i> Activity & Remarks Log</h3>
                
                <div style="display: flex; gap: 10px; margin-bottom: 1.5rem;">
                    <input type="text" id="remarkInput" placeholder="Add a note, meeting summary, or remark..." style="flex: 1; min-width: 0;">
                    <button class="btn btn-outline" onclick="addRemark()"><i class="fas fa-plus"></i></button>
                </div>
                
                <div id="remarksList" style="max-height: 250px; overflow-y: auto; padding-right: 10px;">
                    <!-- Remarks render here -->
                </div>
            </div>
        </section>
    </div>

    <script>
        const leadId = {{ lead_id }};
        let leadData = null;
        let remarksData = [];
        let mouTemplate = "";
        let toolkitTemplate = "";

        window.onload = async function() {
            await fetchTemplates();
            await fetchLead();
        };

        async function fetchTemplates() {
            try {
                let res1 = await fetch('/api/templates/mou_email');
                let d1 = await res1.json();
                mouTemplate = d1.content || "Subject: Partnership MOU\n\nHi Provider,\n\nPlease find the attached MOU...";
                
                let res2 = await fetch('/api/templates/toolkit_email');
                let d2 = await res2.json();
                toolkitTemplate = d2.content || "Subject: Welcome & Toolkit\n\nWelcome aboard! Here are your resources...";
            } catch(e) { }
        }

        async function fetchLead() {
            try {
                const response = await fetch(`/api/leads/${leadId}`);
                const data = await response.json();
                if (data.success) {
                    leadData = data.lead;
                    remarksData = data.remarks || [];
                    renderUI();
                } else {
                    document.getElementById('agencyName').innerText = "Lead Not Found";
                    document.getElementById('agencyMeta').innerText = data.error;
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function updateStage(newStage) {
            try {
                await fetch(`/api/leads/${leadId}/stage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stage: newStage })
                });
                await fetchLead(); // Refresh state
            } catch (e) {
                alert("Error updating stage.");
            }
        }

        function renderUI() {
            // Update Header
            document.getElementById('agencyName').innerText = leadData.name;
            document.getElementById('agencyMeta').innerHTML = `<i class="fas fa-map-marker-alt"></i> ${leadData.location || 'Unknown Location'} &nbsp;|&nbsp; <i class="fas fa-phone"></i> ${leadData.phone || 'No Phone'}`;

            // Update Stepper Visuals
            const currentStage = leadData.crm_stage || 0;
            document.getElementById('stageOverride').value = currentStage;
            
            for (let i = 1; i <= 6; i++) {
                const step = document.getElementById(`step-${i}`);
                step.className = "step"; // reset
                if (currentStage >= i) {
                    step.classList.add("completed");
                    // Change icon to checkmark
                    step.querySelector('.step-circle').innerHTML = '<i class="fas fa-check"></i>';
                } else if (currentStage === i - 1) {
                    step.classList.add("active");
                    step.querySelector('.step-circle').innerHTML = i;
                } else {
                    step.querySelector('.step-circle').innerHTML = i;
                }
            }

            // Render Active Action Panel
            renderActionPanel(currentStage);

            // Render Log
            renderRemarks();
        }

        function renderActionPanel(stage) {
            const panel = document.getElementById('actionPanel');
            
            if (stage === 0) {
                let waLink = "";
                if (leadData.phone && leadData.phone !== "-") {
                    // super simple number extraction for WA link
                    let num = leadData.phone.replace(/\D/g,'');
                    waLink = `<a href="https://wa.me/${num}" target="_blank" class="btn" style="background: #25D366; margin-right: 10px;"><i class="fab fa-whatsapp"></i> WhatsApp</a>`;
                }
                
                panel.innerHTML = `
                    <h2>Step 1: Make Initial Contact</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Connect with the lead via Phone or WhatsApp to introduce the partnership.</p>
                    <div>
                        ${waLink}
                        <button class="btn" onclick="updateStage(1)">Mark Contacted</button>
                    </div>
                `;
            } 
            else if (stage === 1) {
                panel.innerHTML = `
                    <h2>Step 2: Initial Pitch & Email Request</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Deliver the initial pitch. If they are interested, request their primary Email ID to send the MOU.</p>
                    <div class="input-group">
                        <input type="email" id="mouEmailInput" placeholder="Enter Confirmed Email ID..." value="${leadData.email || ''}">
                        <button class="btn" onclick="saveEmailAndAdvance()">Save & Advance</button>
                    </div>
                `;
            }
            else if (stage === 2) {
                panel.innerHTML = `
                    <h2>Step 3: Send MOU</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Ready to send the MOU to <strong>${leadData.mou_email || leadData.email}</strong>.</p>
                    
                    <div style="text-align: left; margin-bottom: 2rem;">
                        <label style="color: var(--accent-primary); font-size: 0.85rem; text-transform: uppercase;">MOU Email Template</label>
                        <textarea id="mouTemplateBox" style="width: 100%; height: 180px; padding: 1rem; border-radius: 8px; background: rgba(15, 23, 42, 0.8); color: #fff; border: 1px solid var(--glass-border); margin-top: 0.5rem; font-family: inherit; resize: vertical;">${mouTemplate}</textarea>
                        
                        <div style="display: flex; justify-content: space-between; margin-top: 0.5rem;">
                            <button class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="saveTemplate('mou_email', 'mouTemplateBox')">💾 Save as Global Default</button>
                            <button class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; background: var(--success);" onclick="copyToClipboard('mouTemplateBox')">📋 Copy to Clipboard</button>
                        </div>
                    </div>
                    
                    <button class="btn" onclick="automateMOU()" id="mouBtn" style="width: 100%;"><i class="fas fa-check-circle"></i> Mark MOU Step Complete</button>
                `;
            }
            else if (stage === 3) {
                panel.innerHTML = `
                    <h2>Step 4: Await Signed MOU</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Have they returned the physically/digitally signed MOU?</p>
                    <button class="btn" style="background: var(--success);" onclick="updateStage(4)"><i class="fas fa-file-signature"></i> Mark MOU Signed</button>
                `;
            }
            else if (stage === 4) {
                panel.innerHTML = `
                    <h2>Step 5: Send Toolkit & Acknowledgement</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Send a Welcome Acknowledgement along with the Counseling Guidelines and Toolkit PDFs.</p>
                    
                    <div style="text-align: left; margin-bottom: 2rem;">
                        <label style="color: var(--accent-primary); font-size: 0.85rem; text-transform: uppercase;">Toolkit Email Template</label>
                        <textarea id="tkTemplateBox" style="width: 100%; height: 180px; padding: 1rem; border-radius: 8px; background: rgba(15, 23, 42, 0.8); color: #fff; border: 1px solid var(--glass-border); margin-top: 0.5rem; font-family: inherit; resize: vertical;">${toolkitTemplate}</textarea>
                        
                        <div style="display: flex; justify-content: space-between; margin-top: 0.5rem;">
                            <button class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="saveTemplate('toolkit_email', 'tkTemplateBox')">💾 Save as Global Default</button>
                            <button class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; background: var(--success);" onclick="copyToClipboard('tkTemplateBox')">📋 Copy to Clipboard</button>
                        </div>
                    </div>

                    <button class="btn" onclick="automateToolkit()" id="tkBtn" style="width: 100%;"><i class="fas fa-check-circle"></i> Mark Toolkit Step Complete</button>
                `;
            }
            else if (stage >= 5) {
                let lastContactHtml = leadData.last_contacted 
                    ? `<span style="color: var(--accent-primary);">Last Follow-up: ${leadData.last_contacted}</span>` 
                    : `<span style="color: #ef4444;">No follow-up logged yet!</span>`;
                    
                    
                panel.innerHTML = `
                    <h2>Step 6: Onboarded & Active</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Agency is fully onboarded. Use the activity log below to track ongoing communications.<br> ${lastContactHtml}</p>
                    <button class="btn btn-outline" onclick="logFollowup()"><i class="fas fa-calendar-check"></i> Log Contact Today</button>
                `;
            }
        }

        async function saveEmailAndAdvance() {
            const email = document.getElementById('mouEmailInput').value.trim();
            if(!email) return alert("Please enter an email address before advancing.");
            
            try {
                await fetch(`/api/leads/${leadId}/mou_email`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                await updateStage(2);
            } catch (e) {
                alert("Error saving email.");
            }
        }

        async function automateMOU() {
            const btn = document.getElementById('mouBtn');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sending Setup...`;
            btn.disabled = true;
            
            try {
                const response = await fetch(`/api/leads/${leadId}/send_mou`, { method: 'POST' });
                const data = await response.json();
                if(data.success) {
                    await updateStage(3);
                } else {
                    alert("Email Automation Error: " + data.error);
                    btn.innerText = "Retry Automate MOU Email";
                    btn.disabled = false;
                }
            } catch(e) {
                alert("Connection failed.");
            }
        }

        async function automateToolkit() {
            const btn = document.getElementById('tkBtn');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sending Setup...`;
            btn.disabled = true;
            
            try {
                const response = await fetch(`/api/leads/${leadId}/send_toolkit`, { method: 'POST' });
                const data = await response.json();
                if(data.success) {
                    await updateStage(5);
                } else {
                    alert("Email Automation Error: " + data.error);
                    btn.innerText = "Retry Automate Toolkit Email";
                    btn.disabled = false;
                }
            } catch(e) {
                alert("Connection failed.");
            }
        }

        async function logFollowup() {
            const today = new Date().toISOString().split('T')[0];
            try {
                await fetch(`/api/leads/${leadId}/contact`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ timestamp: today })
                });
                await fetchLead();
            } catch(e) {
                alert("Failed to log contact.");
            }
        }

        async function manuallyOverrideStage() {
            const select = document.getElementById('stageOverride');
            const newStage = parseInt(select.value);
            const currentStage = leadData.crm_stage || 0;
            
            if (newStage === currentStage) return; // No change
            
            if (confirm(`Are you sure you want to manually force the CRM stage to Step ${newStage}?`)) {
                await updateStage(newStage);
            } else {
                // Revert select dropdown visually if cancelled
                select.value = currentStage;
            }
        }

        async function addRemark() {
            const text = document.getElementById('remarkInput').value.trim();
            if(!text) return;
            const currentStage = leadData.crm_stage || 0;
            
            // disable UI while fetching
            document.getElementById('remarkInput').disabled = true;
            try {
                await fetch(`/api/leads/${leadId}/remarks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stage: currentStage, text: text })
                });
                document.getElementById('remarkInput').value = "";
                await fetchLead(); // Refresh everything to get new remarks
            } catch(e) {
                alert("Failed to save remark.");
            }
            document.getElementById('remarkInput').disabled = false;
        }

        function renderRemarks() {
            const list = document.getElementById('remarksList');
            if (!remarksData || remarksData.length === 0) {
                list.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem; font-style: italic;">No remarks logged yet.</p>`;
                return;
            }
            
            let html = "";
            remarksData.forEach(r => {
                const stageNames = ["Uncontacted", "Contacted", "Pitch Area", "MOU Sent", "MOU Signed", "Toolkit Sent", "Onboarded"];
                const sName = stageNames[r.stage] || "Unknown";
                
                // Format timestamp beautifully
                const d = new Date(r.created_at);
                const dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                html += `
                <div style="background: rgba(15, 23, 42, 0.4); border-left: 3px solid var(--accent-secondary); padding: 0.8rem; margin-bottom: 0.8rem; border-radius: 4px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.4rem;">
                        <span style="font-size: 0.75rem; color: var(--accent-primary); font-weight: bold; text-transform: uppercase;">STAGE: ${sName}</span>
                        <span style="font-size: 0.75rem; color: var(--text-muted);">${dateStr}</span>
                    </div>
                    <p style="font-size: 0.95rem; margin: 0; line-height: 1.4;">${r.remark}</p>
                </div>
                `;
            });
            list.innerHTML = html;
        }

        async function saveTemplate(id, boxId) {
            const content = document.getElementById(boxId).value;
            try {
                await fetch(`/api/templates/${id}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content: content})
                });
                alert("Global template saved successfully!");
                if (id === 'mou_email') mouTemplate = content;
                if (id === 'toolkit_email') toolkitTemplate = content;
            } catch(e) {
                alert("Failed to save template.");
            }
        }

        async function copyToClipboard(boxId) {
            const content = document.getElementById(boxId).value;
            try {
                await navigator.clipboard.writeText(content);
                alert("Copied to clipboard!");
            } catch (err) {
                alert("Clipboard access failed. Please copy manually.");
            }
        }

        // CRM Quick-Jump Search
        let allLeadsCache = null;

        async function searchLeads(query) {
            const dd = document.getElementById('crmSearchDropdown');
            if (!query.trim()) { dd.style.display = 'none'; return; }
            
            if (!allLeadsCache) {
                const res = await fetch('/api/leads');
                const d = await res.json();
                allLeadsCache = d.leads || [];
            }
            
            const q = query.toLowerCase();
            const matches = allLeadsCache.filter(l => l.name && l.name.toLowerCase().includes(q)).slice(0, 8);
            
            if (matches.length === 0) {
                dd.style.display = 'none'; return;
            }
            
            dd.innerHTML = matches.map(l => `
                <div onclick="window.location='/crm/${l.id}'" style="padding: 0.7rem 1rem; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s;" onmouseover="this.style.background='rgba(59,130,246,0.15)'" onmouseout="this.style.background='none'">
                    <div style="font-weight:600; font-size:0.9rem;">${l.name}</div>
                    <div style="font-size:0.75rem; color:var(--text-muted);">${l.location || ''}</div>
                </div>
            `).join('');
            dd.style.display = 'block';
        }

        // Close dropdown on outside click
        document.addEventListener('click', e => {
            if (!document.getElementById('crmSearch').contains(e.target)) {
                document.getElementById('crmSearchDropdown').style.display = 'none';
            }
        });

    </script>
</body>
</html>
