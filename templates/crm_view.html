<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead CRM | LeadSense AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1.5rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-main);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* Glass Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Stepper */
        .stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3rem;
            position: relative;
        }
        
        .stepper::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 5%;
            right: 5%;
            height: 2px;
            background: var(--glass-border);
            z-index: 1;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            width: 16%;
        }

        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-color);
            border: 2px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-bottom: 0.5rem;
            transition: all 0.3s;
        }

        .step.active .step-circle {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }
        
        .step.completed .step-circle {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .step-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.2;
        }

        .step.active .step-title, .step.completed .step-title {
            color: var(--text-main);
            font-weight: 600;
        }

        /* Action Panel */
        .action-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }

        .action-box h2 {
            margin-bottom: 1rem;
            color: var(--accent-primary);
        }
        
        .input-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            justify-content: center;
        }

        input[type="email"], input[type="text"] {
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: var(--bg-color);
            color: white;
            width: 300px;
        }
        
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="/dashboard" class="btn btn-outline" style="padding: 0.6rem 1.2rem;">← Back</a>
            <div style="flex: 1;">
                <h1 id="agencyName">Loading CRM Profile...</h1>
                <p class="subtitle" id="agencyMeta">Gathering data...</p>
            </div>
            <div>
                <select id="stageOverride" class="btn btn-outline" style="padding: 0.6rem 1rem; cursor: pointer; color: var(--accent-primary); border-color: var(--accent-primary);" onchange="manuallyOverrideStage()">
                    <option value="0">0: New Lead</option>
                    <option value="1">1: Contacted</option>
                    <option value="2">2: Pitched & Req Email</option>
                    <option value="3">3: MOU Sent</option>
                    <option value="4">4: MOU Signed</option>
                    <option value="5">5: Toolkit Sent</option>
                    <option value="6">6: Active Follow-up</option>
                </select>
            </div>
        </header>

        <section class="glass-panel">
            <div class="stepper" id="stepper">
                <div class="step" id="step-1">
                    <div class="step-circle">1</div>
                    <div class="step-title">Initial Contact</div>
                </div>
                <div class="step" id="step-2">
                    <div class="step-circle">2</div>
                    <div class="step-title">Pitch & Email Req.</div>
                </div>
                <div class="step" id="step-3">
                    <div class="step-circle">3</div>
                    <div class="step-title">Send MOU</div>
                </div>
                <div class="step" id="step-4">
                    <div class="step-circle">4</div>
                    <div class="step-title">MOU Signed</div>
                </div>
                <div class="step" id="step-5">
                    <div class="step-circle">5</div>
                    <div class="step-title">Send Toolkit</div>
                </div>
                <div class="step" id="step-6">
                    <div class="step-circle">6</div>
                    <div class="step-title">Weekly Follow-up</div>
                </div>
            </div>

            <div class="action-box" id="actionPanel">
                <h2>Loading lifecycle actions...</h2>
            </div>
        </section>
    </div>

    <script>
        const leadId = {{ lead_id }};
        let leadData = null;

        window.onload = async function() {
            await fetchLead();
        };

        async function fetchLead() {
            try {
                const response = await fetch(`/api/leads/${leadId}`);
                const data = await response.json();
                if (data.success) {
                    leadData = data.lead;
                    renderUI();
                } else {
                    document.getElementById('agencyName').innerText = "Lead Not Found";
                    document.getElementById('agencyMeta').innerText = data.error;
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function updateStage(newStage) {
            try {
                await fetch(`/api/leads/${leadId}/stage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stage: newStage })
                });
                await fetchLead(); // Refresh state
            } catch (e) {
                alert("Error updating stage.");
            }
        }

        function renderUI() {
            // Update Header
            document.getElementById('agencyName').innerText = leadData.name;
            document.getElementById('agencyMeta').innerHTML = `<i class="fas fa-map-marker-alt"></i> ${leadData.location || 'Unknown Location'} &nbsp;|&nbsp; <i class="fas fa-phone"></i> ${leadData.phone || 'No Phone'}`;

            // Update Stepper Visuals
            const currentStage = leadData.crm_stage || 0;
            document.getElementById('stageOverride').value = currentStage;
            
            for (let i = 1; i <= 6; i++) {
                const step = document.getElementById(`step-${i}`);
                step.className = "step"; // reset
                if (currentStage >= i) {
                    step.classList.add("completed");
                    // Change icon to checkmark
                    step.querySelector('.step-circle').innerHTML = '<i class="fas fa-check"></i>';
                } else if (currentStage === i - 1) {
                    step.classList.add("active");
                    step.querySelector('.step-circle').innerHTML = i;
                } else {
                    step.querySelector('.step-circle').innerHTML = i;
                }
            }

            // Render Active Action Panel
            renderActionPanel(currentStage);
        }

        function renderActionPanel(stage) {
            const panel = document.getElementById('actionPanel');
            
            if (stage === 0) {
                let waLink = "";
                if (leadData.phone && leadData.phone !== "-") {
                    // super simple number extraction for WA link
                    let num = leadData.phone.replace(/\D/g,'');
                    waLink = `<a href="https://wa.me/${num}" target="_blank" class="btn" style="background: #25D366; margin-right: 10px;"><i class="fab fa-whatsapp"></i> WhatsApp</a>`;
                }
                
                panel.innerHTML = `
                    <h2>Step 1: Make Initial Contact</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Connect with the lead via Phone or WhatsApp to introduce the partnership.</p>
                    <div>
                        ${waLink}
                        <button class="btn" onclick="updateStage(1)">Mark Contacted</button>
                    </div>
                `;
            } 
            else if (stage === 1) {
                panel.innerHTML = `
                    <h2>Step 2: Initial Pitch & Email Request</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Deliver the initial pitch. If they are interested, request their primary Email ID to send the MOU.</p>
                    <div class="input-group">
                        <input type="email" id="mouEmailInput" placeholder="Enter Confirmed Email ID..." value="${leadData.email || ''}">
                        <button class="btn" onclick="saveEmailAndAdvance()">Save & Advance</button>
                    </div>
                `;
            }
            else if (stage === 2) {
                panel.innerHTML = `
                    <h2>Step 3: Send MOU</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Ready to send the MOU to <strong>${leadData.mou_email || leadData.email}</strong>.</p>
                    <button class="btn" onclick="automateMOU()" id="mouBtn"><i class="fas fa-paper-plane"></i> Automate MOU Email</button>
                `;
            }
            else if (stage === 3) {
                panel.innerHTML = `
                    <h2>Step 4: Await Signed MOU</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Have they returned the physically/digitally signed MOU?</p>
                    <button class="btn" style="background: var(--success);" onclick="updateStage(4)"><i class="fas fa-file-signature"></i> Mark MOU Signed</button>
                `;
            }
            else if (stage === 4) {
                panel.innerHTML = `
                    <h2>Step 5: Send Toolkit & Acknowledgement</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Send a Welcome Acknowledgement along with the Counseling Guidelines and Toolkit PDFs.</p>
                    <button class="btn" onclick="automateToolkit()" id="tkBtn"><i class="fas fa-paper-plane"></i> Automate Toolkit Email</button>
                `;
            }
            else if (stage >= 5) {
                let lastContactHtml = leadData.last_contacted 
                    ? `<span style="color: var(--accent-primary);">Last Follow-up: ${leadData.last_contacted}</span>` 
                    : `<span style="color: #ef4444;">No follow-up logged yet!</span>`;
                    
                panel.innerHTML = `
                    <h2>Step 6: Weekly Follow-up Hub</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">MOU is signed and Toolkit is delivered. Now we strictly follow up once a week.<br> ${lastContactHtml}</p>
                    <button class="btn btn-outline" onclick="logFollowup()"><i class="fas fa-calendar-check"></i> Log Follow-up Today</button>
                `;
            }
        }

        async function saveEmailAndAdvance() {
            const email = document.getElementById('mouEmailInput').value.trim();
            if(!email) return alert("Please enter an email address before advancing.");
            
            try {
                await fetch(`/api/leads/${leadId}/mou_email`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                await updateStage(2);
            } catch (e) {
                alert("Error saving email.");
            }
        }

        async function automateMOU() {
            const btn = document.getElementById('mouBtn');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sending Setup...`;
            btn.disabled = true;
            
            try {
                const response = await fetch(`/api/leads/${leadId}/send_mou`, { method: 'POST' });
                const data = await response.json();
                if(data.success) {
                    await updateStage(3);
                } else {
                    alert("Email Automation Error: " + data.error);
                    btn.innerText = "Retry Automate MOU Email";
                    btn.disabled = false;
                }
            } catch(e) {
                alert("Connection failed.");
            }
        }

        async function automateToolkit() {
            const btn = document.getElementById('tkBtn');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sending Setup...`;
            btn.disabled = true;
            
            try {
                const response = await fetch(`/api/leads/${leadId}/send_toolkit`, { method: 'POST' });
                const data = await response.json();
                if(data.success) {
                    await updateStage(5);
                } else {
                    alert("Email Automation Error: " + data.error);
                    btn.innerText = "Retry Automate Toolkit Email";
                    btn.disabled = false;
                }
            } catch(e) {
                alert("Connection failed.");
            }
        }

        async function logFollowup() {
            const today = new Date().toISOString().split('T')[0];
            try {
                await fetch(`/api/leads/${leadId}/contact`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ timestamp: today })
                });
                await fetchLead();
            } catch(e) {
                alert("Failed to log contact.");
            }
        }

        async function manuallyOverrideStage() {
            const select = document.getElementById('stageOverride');
            const newStage = parseInt(select.value);
            const currentStage = leadData.crm_stage || 0;
            
            if (newStage === currentStage) return; // No change
            
            if (confirm(`Are you sure you want to manually force the CRM stage to Step ${newStage}?`)) {
                await updateStage(newStage);
            } else {
                // Revert select dropdown visually if cancelled
                select.value = currentStage;
            }
        }

    </script>
</body>
</html>
